[project]
name = "my-kaggle-history"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.2",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.8",
    "optuna>=4.8.0",
    "pandas>=3.0.1",
    "scikit-learn>=1.8.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "torchaudio==2.8.0",
    "flash-attn==2.6.1",
    "transformers>=5.2.0",
    "accelerate>=1.12.0",
    "bitsandbytes>=0.49.2",
]

[tool.uv.sources]
torch = [{ index = "torch-cu126" }]
torchvision = [{ index = "torch-cu126" }]
torchaudio = [{ index = "torch-cu126" }]

[[tool.uv.index]]
name = "torch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


# 🔥 ここが重要
[tool.uv.extra-build-dependencies]
flash-attn = ["torch==2.8.0"]