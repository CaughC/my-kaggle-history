# n02_houseprice/config/nn_config.yaml
dataset:
  train_path: "n02_houseprice/house-prices-advanced-regression-techniques/train.csv"
  target: "SalePrice"
  # Features used by the model
  features: null
  raw_features: null
  categorical_features:
    - "MSSubClass"
    - "MSZoning"
    - "Street"
    - "Alley"
    - "LotShape"
    - "LandContour"
    - "Utilities"
    - "LotConfig"
    - "LandSlope"
    - "Neighborhood"
    - "Condition1"
    - "Condition2"
    - "BldgType"
    - "HouseStyle"
    - "OverallQual"
    - "OverallCond"
    - "RoofStyle"
    - "RoofMatl"
    - "Exterior1st"
    - "Exterior2nd"
    - "MasVnrType"
    - "ExterQual"
    - "ExterCond"
    - "Foundation"
    - "BsmtQual"
    - "BsmtCond"
    - "BsmtExposure"
    - "BsmtFinType1"
    - "BsmtFinType2"
    - "Heating"
    - "HeatingQC"
    - "CentralAir"
    - "Electrical"
    - "KitchenQual"
    - "Functional"
    - "FireplaceQu"
    - "GarageType"
    - "GarageFinish"
    - "GarageQual"
    - "GarageCond"
    - "PavedDrive"
    - "PoolQC"
    - "Fence"
    - "MiscFeature"
    - "SaleType"
    - "SaleCondition"
  
  test_path: "n02_houseprice/house-prices-advanced-regression-techniques/test.csv"
  output_path: "n02_houseprice/output/nn_submission.csv"
  output_target: "SalePrice"
  output_features:
    - "Id"

model:
  layers: [256, 128, 64]
  dropout: 0.2
  learning_rate: 1e-3
  weight_decay: 0.01
  batch_size: 32
  epochs: 200

n_folds: 5
random_state: 42
device: "cpu"
