# n01_titanic/config/nn_config.yaml
dataset:
  train_path: "n01_titanic/titanic/train.csv"
  target: "Survived"
  # Features used by the model
  features: 
    - "Pclass"
    - "Sex"
    - "Age"
    - "SibSp"
    - "Parch"
    - "Fare"
    - "Embarked"
    - "Title"
    - "FamilySize"
    - "IsAlone"
    - "Ticket"
    - "Cabin"
    - "Ticketab"
    - "Ticketnum"
    - "Cabinab"
    - "Cabinnum"
  raw_features:
    - "Pclass"
    - "Sex"
    - "Age"
    - "SibSp"
    - "Parch"
    - "Fare"
    - "Embarked"
    - "Ticket"
    - "Cabin"
    - "Name"
  categorical_features:
    - "Sex"
    - "Embarked"
    - "Title"
    - "Pclass"
    - "Ticket"
    - "Cabin"
    - "Ticketab"
    - "Cabinab"
  
  test_path: "n01_titanic/titanic/test.csv"
  output_path: "n01_titanic/output/nn_submission.csv"
  output_target: "Survived"
  output_features:
    - "PassengerId"

model:
  layers: [128, 64, 32] # Increased capacity for more features
  dropout: 0.3
  learning_rate: 1e-3
  weight_decay: 0.01
  batch_size: 32
  epochs: 100 # More epochs for more complex feature space

n_folds: 5
random_state: 42
device: "cpu"
